name: build-windows

# 云端 Windows 编译：推代码或手动触发，产出 NSIS 安装包 artifact。
# 本地沙箱环境无法完成 cargo 编译（文件创建被限流），改由 GitHub Actions 出包。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      # tauri build 会自动跑 beforeBuildCommand（npm run build && build:cli），
      # 因此这里用 --no-bundle 之外不需要额外处理；直接出 NSIS 安装包。
      - name: Build Tauri app (NSIS installer)
        run: npx tauri build --verbose

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: huaxia-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/archive-gallery.exe
          if-no-files-found: error
