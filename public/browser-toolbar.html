<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>匣浏览器 · 工具栏</title>
<style>
  :root {
    --bg: #14161b;
    --bg-raised: #1d2027;
    --line: #2c313c;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent: #7c93ff;
    --danger: #ff6b6b;
    --ok: #57d39b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 12px/1 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    user-select: none;
  }
  .bar {
    display: flex; align-items: center; gap: 5px;
    height: 100%; padding: 0 8px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #181b21, #14161b);
  }
  button {
    height: 26px; min-width: 28px; padding: 0 7px;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg-raised); color: var(--text);
    font: inherit; cursor: pointer; flex: none;
  }
  button:hover { background: #272b35; border-color: #3a404d; }
  button:active { background: #313642; }
  button.busy { color: var(--accent); border-color: #33406b; }
  button.zoom { min-width: 52px; font-variant-numeric: tabular-nums; }
  #settings { font-size: 13px; }
  .tabs {
    display: flex; align-items: center; gap: 4px;
    max-width: 44vw; overflow-x: auto; scrollbar-width: none;
    padding: 2px; flex: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 6px 0 10px;
    border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--muted);
    cursor: pointer; max-width: 190px; min-width: 0;
  }
  .tab:hover { background: var(--bg-raised); color: var(--text); }
  .tab.active {
    background: #262a33; color: var(--text);
    border-color: #3a404d;
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab.dragging { opacity: .45; }
  .tab.drop-target { border-color: var(--accent); }
  /* M5①：域名分组头（折叠/展开），单个小胶囊挤在 38px 工具栏里 */
  .tab-group-head {
    display: flex; align-items: center; flex: none;
    height: 26px; padding: 0 6px; border-radius: 7px;
    background: rgba(255,255,255,.05); color: var(--muted);
    font-size: 10.5px; cursor: pointer; max-width: 110px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .tab-group-head:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .tab-group-head.is-collapsed { color: var(--accent); }
  .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .spinner {
    width: 9px; height: 9px; flex: none; border-radius: 50%;
    border: 1.5px solid #3d4356; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab .x {
    flex: none; width: 16px; height: 16px; line-height: 14px;
    border-radius: 5px; text-align: center;
    color: var(--muted); font-size: 12px;
  }
  .tab .x:hover { background: #3a2126; color: var(--danger); }
  .addr-wrap {
    flex: 1 1 auto; display: flex; align-items: center;
    height: 26px; padding: 0 8px; gap: 6px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #0f1116; min-width: 80px;
  }
  .addr-wrap:focus-within { border-color: var(--accent); }
  .addr-wrap.bad { border-color: #7a2e34; background: #1a1114; animation: flash .5s 2; }
  .addr-wrap.ok { border-color: #2c5d47; background: #0f1a15; }
  .addr-wrap.stalled { border-color: #6b4a22; background: #1a150e; }
  .addr-wrap.stalled #addr { color: #d8b077; }
  @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .addr-wrap .lock { color: var(--muted); flex: none; font-size: 11px; }
  #addr {
    flex: 1; min-width: 60px; border: 0; outline: 0; background: transparent;
    color: var(--text); font: 12px "Cascadia Mono", Consolas, monospace;
    user-select: text;
  }
  .sep { width: 1px; height: 20px; background: var(--line); flex: none; }
</style>
</head>
<body>
<div class="bar">
  <button id="back" title="后退（Alt+←）">←</button>
  <button id="forward" title="前进（Alt+→）">→</button>
  <button id="reload" title="刷新（Ctrl+R / F5）">⟳</button>
  <button id="home" title="回到主页">⌂</button>
  <div class="tabs" id="tabs"></div>
  <button id="newtab" title="新建标签（Ctrl+T）">+</button>
  <div class="sep"></div>
  <div class="addr-wrap" id="addrWrap">
    <span class="lock" id="lock">◉</span>
    <input id="addr" spellcheck="false" autocomplete="off" title="输入网址或搜索词，回车前往（Ctrl+L 聚焦）" />
  </div>
  <button id="zoomOut" title="缩小（Ctrl+−）">−</button>
  <button id="zoom" class="zoom" title="重置 100%（Ctrl+0）">100%</button>
  <button id="zoomIn" title="放大（Ctrl++）">+</button>
  <button id="detach" title="弹出为独立窗口（M5 逃生舱）" style="display:none">⤢</button>
  <button id="settings" title="浏览器设置（Ctrl+,）">⚙</button>
</div>

<!-- 外置脚本：正式包 CSP 为 script-src 'self'，内联脚本会被整段拦掉。 -->
<script src="browser-toolbar.js"></script>
</body>
</html>
